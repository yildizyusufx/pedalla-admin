<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="img/mark.png">
  <title>Pedalla Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <div class="loading"><div class="spin"></div></div>
  <script type="module">
    // On a static host without a database (no /api/_mode, or no TURSO_DATABASE_URL), open the browser demo.
    // On the local server (server.js) /api/_mode is answered with db:true.
    let mode = null;
    try { const r = await fetch('api/_mode', { cache: 'no-store' }); if (r.ok) mode = await r.json(); } catch {}
    if (!mode || !mode.db) { location.replace('demo.html' + location.hash); }
    else { const { boot } = await import('./app.js'); boot(); }
  </script>
</body>
</html>
