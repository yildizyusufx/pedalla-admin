<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="img/mark.png">
  <title>Pedalla Admin Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="style.css">
  <style>.demo-bar{font-family:var(--font);position:fixed;right:12px;bottom:12px;z-index:1800;background:var(--brand-d);color:#fff;font-size:12px;padding:6px 10px;border-radius:99px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}.demo-bar button{background:var(--accent);color:var(--brand-d);border:0;border-radius:99px;padding:3px 9px;font:inherit;font-weight:700;cursor:pointer}</style>
  <script>window.PEDALLA_DEMO = true;</script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/sqljs/sql-asm.js"></script>
</head>
<body>
  <div class="loading"><div class="spin"></div></div>
  <script type="module">
    // Browser-only demo: the same API code runs on an in-browser SQLite database (sql.js).
    // Data is kept in this browser only (localStorage) and can be reset at any time.
    import { createApi } from './shared/api.js';
    import { seed } from './shared/seed.js';
    import { setTransport, setToken, session } from './core.js';
    import { boot } from './app.js';

    const KEY = 'pedalla_demo_db_v1';
    const SQL = await initSqlJs();
    let saved = null;
    try { const b64 = localStorage.getItem(KEY); if (b64) saved = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); } catch {}
    const sdb = saved ? new SQL.Database(saved) : new SQL.Database();
    const norm = (p) => p.map((v) => (v === undefined ? null : typeof v === 'boolean' ? (v ? 1 : 0) : v));
    let depth = 0;
    const db = {
      all(sql, p = []) { const st = sdb.prepare(sql); st.bind(norm(p)); const out = []; while (st.step()) out.push(st.getAsObject()); st.free(); return out; },
      get(sql, p = []) { return db.all(sql, p)[0]; },
      run(sql, p = []) { sdb.run(sql, norm(p)); return { changes: sdb.getRowsModified(), lastId: sdb.exec('SELECT last_insert_rowid()')[0].values[0][0] }; },
      exec(sql) { sdb.exec(sql); },
      async tx(fn) {
        if (depth++) { try { return await fn(); } finally { depth--; } }
        sdb.exec('BEGIN'); try { const r = await fn(); sdb.exec('COMMIT'); return r; } catch (e) { sdb.exec('ROLLBACK'); throw e; } finally { depth--; }
      },
    };
    // demo-only password check (the real server uses scrypt)
    const h = (s) => { let x = 2166136261; for (const c of s) { x ^= c.codePointAt(0); x = Math.imul(x, 16777619) >>> 0; } return 'demo:' + x.toString(16); };
    const api = await createApi(db, { hashPassword: h, verifyPassword: (pw, st) => h(pw) === st, randomToken: () => crypto.getRandomValues(new Uint32Array(4)).join('-') });
    await seed(api, h);
    const persist = () => { try { const bytes = sdb.export(); let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); localStorage.setItem(KEY, btoa(s)); } catch {} };
    setTransport(async (method, url, body, token) => {
      const u = new URL(url, location.href);
      const out = await api.handle({ method, path: u.pathname.slice(u.pathname.indexOf('/api/')), query: Object.fromEntries(u.searchParams), body: body || {}, token });
      if (method !== 'GET') persist();
      return JSON.parse(JSON.stringify(out));
    });
    persist();
    if (!session.token) { const r = await api.handle({ method: 'POST', path: '/api/login', body: { email: 'admin@pedalla.bike', password: 'pedalla123' } }); if (r.status === 200) setToken(r.body.token); }
    await boot();
    const bar = document.createElement('div'); bar.className = 'demo-bar';
    bar.innerHTML = 'Demo modu · veriler yalnızca bu tarayıcıda <button>Sıfırla</button>';
    bar.querySelector('button').onclick = () => { try { localStorage.removeItem(KEY); } catch {} setToken(null); location.hash = ''; location.reload(); };
    document.documentElement.appendChild(bar);
  </script>
</body>
</html>
